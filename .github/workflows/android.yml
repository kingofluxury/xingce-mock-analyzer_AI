name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "tools/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:www

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" > /dev/null

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少仓库 Secret：ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/xingce-release.p12
          ls -l android/app/xingce-release.p12

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect and verify APK
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | sort | head -n 1)
          if [ -z "$APK" ]; then
            echo "没有找到任何 APK，输出目录内容："
            find android/app/build/outputs -type f | head -50
            exit 1
          fi
          echo "APK: $APK"
          cp "$APK" app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xingce-analyzer-release
          path: app-release.apk
          if-no-files-found: error


